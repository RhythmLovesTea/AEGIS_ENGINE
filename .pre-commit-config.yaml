# AEGIS-Marine Pre-commit Configuration
# Enforces code formatting, type checking, and Rule 6 compliance

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: lint-banned-terms
        name: Enforce Rule 6 Objective Maritime Terminology
        entry: python3 scripts/lint_banned_terms.py
        language: system
        pass_filenames: false
        always_run: true
